name: 同步表格并发布

on:
  schedule:
    # 每周一 04:00 UTC（北京 12:00）自动同步一次表格
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "spider/**"          # 改了 spider 源码就重建合并 jar（否则不触发任何运行）
      - ".github/workflows/sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-4k-anime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 同步在线表格
        run: python3 src/sync_table.py

      - name: 补全封面与详情（Bangumi：年份/地区/导演/演员/简介）
        run: python3 src/enrich.py
        continue-on-error: true

      - name: 跟随饭太硬官方 jar 重建合并 jar（拿不到就保持现有 jar）
        run: |
          # 官方 jar 伪装成 .jpg，这里校验 md5 并解包到 work/merge/fty；
          # 同步失败或工具链缺失时不覆盖已有 jar，保证配置永远可用。
          if python3 src/fetch_upstream_jar.py; then
            bash build_spider.sh || echo "⚠️ 重建失败，保留现有 jar"
          else
            echo "⚠️ 上游 jar 同步失败，保留现有 jar"
          fi

      # 注意顺序：先重建 jar，再生成配置 —— 配置里写的 `;md5;<jar的md5>`
      # 必须对应刚构建出来的 jar，否则 App 每次都会判定缓存失效。
      - name: 解析饭太硬官方配置并插入 4k动漫线路
        env:
          DATA_BASE: ${{ vars.DATA_BASE }}
        run: |
          # 抓不到时脚本会保留现有配置不覆盖，所以这里失败不影响 App
          python3 src/fetch_fty.py

      - name: 导出静态数据（anime.json 带封面+详情、meta.json、占位封面）
        run: python3 src/export_data.py

      - name: 生成首页（纯静态索引页）
        run: python3 src/build_web.py

      - name: 配置自检（配置里的 csp_X 必须在 jar 里有）
        run: python3 src/check_config.py

      - name: 提交数据变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次同步无变化"
          else
            git commit -m "chore(sync): 同步表格 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 打包静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    # Pages 的部署 API 是串行的：上一次还没跑完就发起新的会报
    #   "Deployment request failed ... due to in progress deployment"
    # 这里给部署单独一个并发组，保证同一时刻只有一个部署在跑。
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 失败就等一会儿重试一次（那个报错是纯排队冲突，重试基本都能过）。
      # 注意：这一步失败**不影响 App**：配置 / jar / 数据都在仓库里，App 取的是 raw，
      # Pages 只是给人看的索引页。
      - name: Pages 部署重试（排队冲突时等 60 秒再来一次）
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
